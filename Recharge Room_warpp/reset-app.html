<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Recharge Room App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
        }
        .button {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: all 0.3s ease;
        }
        .button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .warning {
            background: rgba(255,0,0,0.2);
            border: 2px solid rgba(255,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🔄 Reset Recharge Room App</h1>
    
    <div class="warning">
        ⚠️ <strong>Warning:</strong> This will clear all your app data including mood logs, journal entries, tasks, and voice notes.
    </div>

    <p>Use this tool to reset the app to its initial state for testing the authentication flow.</p>

    <button class="button" onclick="resetApp()">
        🗑️ Reset All App Data
    </button>

    <button class="button" onclick="openApp()">
        🚀 Open Recharge Room App
    </button>

    <script>
        function resetApp() {
            if (confirm('Are you absolutely sure? This will delete ALL your data and cannot be undone.')) {
                // Clear all localStorage data
                const keysToRemove = [
                    'recharge_auth',
                    'recharge_user',
                    'recharge_theme',
                    'recharge_tasks',
                    'recharge_journal',
                    'recharge_moods',
                    'recharge_voices',
                    'recharge_badges',
                    'recharge_quick_actions',
                    'recharge_voice_drafts'
                ];

                keysToRemove.forEach(key => {
                    localStorage.removeItem(key);
                });

                alert('✅ App data has been reset successfully!\n\nThe app will now show the login page on next visit.');
                
                // Optional: Open the app immediately
                if (confirm('Would you like to open the app now to see the login page?')) {
                    window.open('http://localhost:3000', '_blank');
                }
            }
        }

        function openApp() {
            window.open('http://localhost:3000', '_blank');
        }
    </script>
</body>
</html>

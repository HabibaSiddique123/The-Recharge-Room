<html lang="en">
  <head>

    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Your personal space for growth, reflection, and achieving your goals. A comprehensive wellness dashboard with journaling, mood tracking, task management, and voice notes." />
    <meta name="keywords" content="wellness, journaling, mood tracking, productivity, mental health, voice notes, tasks" />

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Recharge Room" />
    <meta name="msapplication-TileColor" content="#6366f1" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Recharge Room - Wellness Dashboard" />
    <meta property="og:description" content="Your personal space for growth, reflection, and achieving your goals." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rechargeroom.app" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Recharge Room - Wellness Dashboard" />
    <meta name="twitter:description" content="Your personal space for growth, reflection, and achieving your goals." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>Recharge Room - Wellness Dashboard</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
